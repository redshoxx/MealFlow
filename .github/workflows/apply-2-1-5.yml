name: Apply MealFlow 2.1.5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-2-1-5.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply 2.1.5 changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_between(text, start_marker, end_marker, replacement):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement + "\n\n" + text[end:]

          app_path = Path('App.tsx')
          app = app_path.read_text()

          app = app.replace("import { SafeAreaProvider, useSafeAreaInsets } from 'react-native-safe-area-context';", "import { SafeAreaProvider, SafeAreaView, useSafeAreaInsets } from 'react-native-safe-area-context';")
          app = app.replace("import { colors, radius, setThemePalette, shadow, spacing, typography } from './src/ui/theme';", "import { colors, getShadow, radius, setThemePalette, spacing, typography } from './src/ui/theme';")
          app = app.replace('...shadow', '...getShadow()')

          anchor = '''function todayIso() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
          }
          '''
          if anchor not in app:
              raise SystemExit('todayIso anchor not found')
          helper = anchor + '''
          function dateIso(date: Date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
          }

          function getWeekDays(weekOffset = 0) {
            const base = new Date();
            base.setHours(12, 0, 0, 0);
            const monday = new Date(base);
            monday.setDate(base.getDate() - ((base.getDay() + 6) % 7) + (weekOffset * 7));
            return DAYS.map((day, index) => {
              const date = new Date(monday);
              date.setDate(monday.getDate() + index);
              const iso = dateIso(date);
              return {
                day,
                date,
                iso,
                dayNumber: date.toLocaleDateString('de-AT', { day: '2-digit' }),
                monthShort: date.toLocaleDateString('de-AT', { month: 'short' }).replace('.', ''),
                isToday: iso === todayIso(),
              };
            });
          }
          '''
          app = app.replace(anchor, helper)

          swipe_anchor = '''function useIosSwipeBack(onBack: () => void, enabled = true) {
            return useMemo(() => PanResponder.create({
              onMoveShouldSetPanResponder: (_event, gesture) => (
                Platform.OS === 'ios'
                && enabled
                && gesture.x0 <= 34
                && gesture.dx > 14
                && Math.abs(gesture.dx) > Math.abs(gesture.dy) * 1.25
              ),
              onPanResponderRelease: (_event, gesture) => {
                if (gesture.dx > 78 && gesture.vx > 0.15) onBack();
              },
            }), [enabled, onBack]);
          }
          '''
          if swipe_anchor not in app:
              raise SystemExit('swipe anchor not found')
          swipe_extra = swipe_anchor + '''
          function useSwipeDownToClose(onClose: () => void, enabled = true) {
            return useMemo(() => PanResponder.create({
              onMoveShouldSetPanResponder: (_event, gesture) => (
                enabled
                && gesture.dy > 8
                && Math.abs(gesture.dy) > Math.abs(gesture.dx) * 1.3
              ),
              onPanResponderRelease: (_event, gesture) => {
                if (gesture.dy > 54 || gesture.vy > 0.72) onClose();
              },
            }), [enabled, onClose]);
          }

          function SheetDismissHandle({ onClose }: { onClose: () => void }) {
            const dismiss = useSwipeDownToClose(onClose);
            return <View {...dismiss.panHandlers} style={styles.sheetDismissZone}><View style={styles.sheetHandle} /></View>;
          }

          function LoadingScreen({ message = 'Dein Haushalt wird vorbereitet …' }: { message?: string }) {
            return <View style={styles.loadingScreen}><View style={styles.loadingLogo}><MaterialCommunityIcons name="silverware-fork-knife" size={30} color="#FFFFFF" /></View><Text style={styles.loadingBrand}>MealFlow</Text><Text style={styles.loadingMessage}>{message}</Text><View style={styles.loadingProgress}><View style={styles.loadingProgressFill} /></View><Text style={styles.loadingHint}>Plan · Einkauf · Rezepte</Text></View>;
          }
          '''
          app = app.replace(swipe_anchor, swipe_extra)

          old_home = '''  const currentDay = getCurrentDay();
            const tonight = meals[currentDay] || '';
            const planned = DAYS.filter((day) => Boolean(meals[day])).length;'''
          new_home = '''  const tonight = meals[todayIso()] || '';
            const planned = getWeekDays(1).filter((entry) => Boolean(meals[entry.iso])).length;'''
          if old_home not in app:
              raise SystemExit('home planner snippet not found')
          app = app.replace(old_home, new_home)
          app = app.replace('<Text style={styles.metricLabel}>Abende geplant</Text>', '<Text style={styles.metricLabel}>nächste Woche geplant</Text>', 1)

          new_plan = r'''function PlanScreen({ household, meals, setMeals, onSettings }: { household: Household; meals: Record<string, string>; setMeals: React.Dispatch<React.SetStateAction<Record<string, string>>>; onSettings: () => void }) {
            const [editingDay, setEditingDay] = useState<string | null>(null);
            const [editingDate, setEditingDate] = useState<string | null>(null);
            const [mealText, setMealText] = useState('');
            const weekDays = getWeekDays(1).map((entry) => ({ ...entry, meal: meals[entry.iso]?.trim() ?? '' }));
            const plannedCount = weekDays.filter((entry) => Boolean(entry.meal)).length;
            const remainingCount = 7 - plannedCount;
            const startDate = weekDays[0]!.date;
            const endDate = weekDays[6]!.date;
            const rangeLabel = `${startDate.toLocaleDateString('de-AT', { day: '2-digit', month: 'short' })} – ${endDate.toLocaleDateString('de-AT', { day: '2-digit', month: 'short' })}`;
            const closeEditor = () => { setEditingDay(null); setEditingDate(null); setMealText(''); };
            const openEditor = (day: string, plannedDate: string) => { setEditingDay(day); setEditingDate(plannedDate); setMealText(meals[plannedDate] ?? ''); Haptics.selectionAsync().catch(() => undefined); };
            const persist = async () => {
              if (!editingDate) return;
              const value = mealText.trim();
              const plannedDate = editingDate;
              setMeals((current) => ({ ...current, [plannedDate]: value }));
              closeEditor();
              try { await saveMeal(plannedDate, value || null); Haptics.notificationAsync(Haptics.NotificationFeedbackType.Success).catch(() => undefined); }
              catch (error: any) { Alert.alert('Speichern nicht möglich', germanError(error?.message)); }
            };
            const removePlan = async () => {
              if (!editingDate) return;
              const plannedDate = editingDate;
              setMeals((current) => ({ ...current, [plannedDate]: '' }));
              closeEditor();
              try { await saveMeal(plannedDate, null); Haptics.selectionAsync().catch(() => undefined); }
              catch (error: any) { Alert.alert('Planung konnte nicht entfernt werden', germanError(error?.message)); }
            };
            return <>
              <ScrollView contentInsetAdjustmentBehavior="automatic" contentContainerStyle={styles.screenContent}>
                <ScreenHeader eyebrow={`${rangeLabel} · ${household.name}`} title="Wochenplan" subtitle="Plane immer die kommende Woche – von Montag bis Sonntag." action={<IconButton icon="account-circle-outline" onPress={onSettings} accessibilityLabel="Konto und Einstellungen" />} />
                <SurfaceCard style={styles.weekOverviewCard}>
                  <View style={styles.weekOverviewTop}><View><Text style={styles.weekOverviewLabel}>NÄCHSTE WOCHE</Text><Text style={styles.weekOverviewTitle}>{plannedCount} von 7 Abenden geplant</Text></View><View style={styles.weekOverviewBadge}><MaterialCommunityIcons name={remainingCount === 0 ? 'check-all' : 'calendar-edit'} size={20} color={colors.accent} /><Text style={styles.weekOverviewBadgeText}>{remainingCount === 0 ? 'Fertig' : `${remainingCount} offen`}</Text></View></View>
                  <View style={styles.weekProgressTrack}><View style={[styles.weekProgressFill, { width: `${Math.round((plannedCount / 7) * 100)}%` as `${number}%` }]} /></View>
                  <View style={styles.weekStrip}>{weekDays.map((entry) => <Pressable key={entry.iso} onPress={() => openEditor(entry.day, entry.iso)} accessibilityLabel={`${entry.day}: ${entry.meal || 'noch kein Abendessen geplant'}`} style={({ pressed }) => [styles.weekStripDay, { opacity: pressed ? 0.72 : 1 }]}><Text style={styles.weekStripDow}>{entry.day.slice(0, 2).toUpperCase()}</Text><Text style={styles.weekStripDate}>{entry.dayNumber}</Text><View style={[styles.weekStripDot, entry.meal ? styles.weekStripDotPlanned : styles.weekStripDotOpen]} /></Pressable>)}</View>
                </SurfaceCard>
                <View style={styles.weekSectionHeader}><View><Text style={styles.weekSectionTitle}>Abendessen</Text><Text style={styles.weekSectionHint}>Kommende Woche · gemeinsamer Plan</Text></View><MaterialCommunityIcons name="silverware-fork-knife" size={22} color={colors.accent} /></View>
                <View style={styles.dayList}>{weekDays.map((entry) => { const selected = Boolean(entry.meal); return <Pressable key={entry.iso} onPress={() => openEditor(entry.day, entry.iso)} style={({ pressed }) => [styles.dayCard, { opacity: pressed ? 0.76 : 1 }]}><View style={styles.dayDateBlock}><Text style={styles.dayDateDow}>{entry.day.slice(0, 2).toUpperCase()}</Text><Text style={styles.dayDateNumber}>{entry.dayNumber}</Text><Text style={styles.dayDateMonth}>{entry.monthShort}</Text></View><View style={styles.dayCardContent}><View style={styles.dayTitleRow}><Text style={styles.dayName}>{entry.day}</Text><Text style={[styles.dayStatusPill, selected ? styles.dayStatusPlanned : styles.dayStatusOpen]}>{selected ? 'Geplant' : 'Noch offen'}</Text></View><Text style={[styles.dayMeal, !selected && styles.dayMealEmpty]} numberOfLines={2}>{entry.meal || 'Noch kein Abendessen geplant'}</Text><Text style={styles.dayMeta}>{selected ? 'Tippen, um das Abendessen zu ändern' : 'Tippen und Abendessen für diesen Tag festlegen'}</Text></View><View style={[styles.dayAction, selected && styles.dayActionPlanned]}><MaterialCommunityIcons name={selected ? 'pencil-outline' : 'plus'} size={21} color={selected ? colors.accent : colors.textSecondary} /></View></Pressable>; })}</View>
              </ScrollView>
              <Modal transparent visible={Boolean(editingDay)} animationType="fade" presentationStyle="overFullScreen" onRequestClose={closeEditor}><KeyboardAvoidingView style={styles.modalFlex} behavior={Platform.OS === 'ios' ? 'padding' : undefined}><Pressable style={styles.modalOverlay} onPress={closeEditor} /><View style={styles.editorSheet}><SheetDismissHandle onClose={closeEditor} /><Text style={styles.editorEyebrow}>ABENDESSEN PLANEN</Text><Text style={styles.editorTitle}>{editingDay}</Text><Text style={styles.fieldHint}>{editingDate ? new Date(`${editingDate}T12:00:00`).toLocaleDateString('de-AT', { weekday: 'long', day: '2-digit', month: 'long' }) : ''}</Text><Text style={styles.fieldLabel}>Gericht</Text><TextInput autoFocus value={mealText} onChangeText={setMealText} placeholder="z. B. Ofengemüse mit Feta" placeholderTextColor={colors.textTertiary} style={styles.largeInput} returnKeyType="done" onSubmitEditing={persist} /><ActionButton label={editingDate && meals[editingDate] ? 'Änderung speichern' : 'Abendessen einplanen'} icon="check" onPress={persist} />{editingDate && meals[editingDate] ? <ActionButton label="Aus Wochenplan entfernen" icon="calendar-remove-outline" variant="ghost" onPress={removePlan} /> : null}</View></KeyboardAvoidingView></Modal>
            </>;
          }'''
          app = replace_between(app, 'function PlanScreen(', 'function ShoppingSwipeRow(', new_plan)

          # Shopping sheet: lighter animation + swipe down handle.
          shop_start = app.index('function ShoppingScreen(')
          shop_end = app.index('function OwnRecipeEditor(', shop_start)
          shop = app[shop_start:shop_end]
          shop = shop.replace('animationType="slide" presentationStyle="overFullScreen"', 'animationType="fade" presentationStyle="overFullScreen"')
          shop = shop.replace('<View style={styles.sheetHandle} />', '<SheetDismissHandle onClose={() => setAddOpen(false)} />', 1)
          app = app[:shop_start] + shop + app[shop_end:]

          # Own recipe editor: keep all content inside the iPhone safe area.
          own_start = app.index('function OwnRecipeEditor(')
          own_end = app.index('function RecipeFilterSheet(', own_start)
          own = app[own_start:own_end]
          own = own.replace('<Modal visible={visible} animationType="slide" onRequestClose={goBack}>\n      <SafeAreaProvider>\n        <KeyboardAvoidingView style={styles.fullModal} behavior={Platform.OS === \'ios\' ? \'padding\' : undefined} {...swipeBack.panHandlers}>', '<Modal visible={visible} animationType="fade" presentationStyle="fullScreen" statusBarTranslucent={false} onRequestClose={goBack}>\n      <SafeAreaView style={styles.fullModal} edges={[\'top\', \'bottom\']}>\n        <KeyboardAvoidingView style={styles.fullModal} behavior={Platform.OS === \'ios\' ? \'padding\' : undefined} {...swipeBack.panHandlers}>')
          own = own.replace('</KeyboardAvoidingView>\n      </SafeAreaProvider>\n    </Modal>', '</KeyboardAvoidingView>\n      </SafeAreaView>\n    </Modal>')
          app = app[:own_start] + own + app[own_end:]

          # Recipe filter is a dismissible lightweight bottom sheet.
          filter_start = app.index('function RecipeFilterSheet(')
          filter_end = app.index('function RecipeDetail(', filter_start)
          filt = app[filter_start:filter_end]
          filt = filt.replace('animationType="slide"', 'animationType="fade"')
          filt = filt.replace('<View style={styles.sheetHandle} />', '<SheetDismissHandle onClose={onClose} />', 1)
          app = app[:filter_start] + filt + app[filter_end:]

          # Recipe detail safe area.
          detail_start = app.index('function RecipeDetail(')
          detail_end = app.index('function RecipesScreen(', detail_start)
          detail = app[detail_start:detail_end]
          detail = detail.replace('<Modal visible animationType="slide" onRequestClose={onClose}><SafeAreaProvider><ScrollView', '<Modal visible animationType="fade" presentationStyle="fullScreen" statusBarTranslucent={false} onRequestClose={onClose}><SafeAreaView style={styles.fullModal} edges={[\'top\', \'bottom\']}><ScrollView')
          detail = detail.replace('</ScrollView></SafeAreaProvider></Modal>', '</ScrollView></SafeAreaView></Modal>')
          app = app[:detail_start] + detail + app[detail_end:]

          # Day picker now always targets next week and can be dismissed downward.
          new_day_picker = r'''function DayPicker({ selection, onClose, onSelect }: { selection: RecipeSelection | null; onClose: () => void; onSelect: (plannedDate: string) => void }) {
            const title = selection?.recipe.title ?? '';
            const weekDays = getWeekDays(1);
            return <Modal transparent visible={Boolean(selection)} animationType="fade" presentationStyle="overFullScreen" onRequestClose={onClose}><Pressable style={styles.modalOverlay} onPress={onClose} /><View style={styles.dayPickerSheet}><SheetDismissHandle onClose={onClose} /><Text style={styles.editorEyebrow}>NÄCHSTE WOCHE EINPLANEN</Text><Text style={styles.dayPickerTitle}>{title}</Text><View style={styles.dayPickerGrid}>{weekDays.map((entry) => <Pressable key={entry.iso} onPress={() => onSelect(entry.iso)} style={styles.dayPickerButton}><View><Text style={styles.dayPickerButtonText}>{entry.day}</Text><Text style={styles.dayPickerDate}>{entry.date.toLocaleDateString('de-AT', { day: '2-digit', month: 'long' })}</Text></View><MaterialCommunityIcons name="chevron-right" size={21} color={colors.textTertiary} /></Pressable>)}</View></View></Modal>;
          }'''
          app = replace_between(app, 'function DayPicker(', 'function TabBar(', new_day_picker)

          # Appearance + Cozy Mode.
          app = app.replace("  const applyAppearance = (mode: ThemeMode) => {\n    const nextDark = mode === 'dark' || (mode === 'system' && Appearance.getColorScheme() === 'dark');\n    setThemePalette(nextDark ? 'dark' : 'light');\n    refreshAppStyles();\n    setDarkMode(nextDark);\n  };", "  const applyAppearance = (mode: ThemeMode, cozy = preferences.cozyMode) => {\n    const nextDark = mode === 'dark' || (mode === 'system' && Appearance.getColorScheme() === 'dark');\n    setThemePalette(nextDark ? 'dark' : 'light', cozy);\n    refreshAppStyles();\n    setDarkMode(nextDark);\n  };")
          app = app.replace('    applyAppearance(next.themeMode);', '    applyAppearance(next.themeMode, next.cozyMode);')
          app = app.replace('      applyAppearance(loaded.themeMode);', '      applyAppearance(loaded.themeMode, loaded.cozyMode);')
          app = app.replace("      setThemePalette(colorScheme === 'dark' ? 'dark' : 'light');", "      setThemePalette(colorScheme === 'dark' ? 'dark' : 'light', preferences.cozyMode);")
          app = app.replace('  }, [preferences.themeMode]);', '  }, [preferences.themeMode, preferences.cozyMode]);')

          # Settings: Cozy Mode and swipe-down dismissal.
          settings_start = app.index('function SettingsSheet(')
          settings_end = app.index('function HomeScreen(', settings_start)
          settings = app[settings_start:settings_end]
          settings = settings.replace('animationType="slide" presentationStyle="overFullScreen"', 'animationType="fade" presentationStyle="overFullScreen"')
          settings = settings.replace('<View style={styles.sheetHandle} />', '<SheetDismissHandle onClose={onClose} />', 1)
          appearance_hint = '''            <Text style={styles.fieldHint}>{preferences.themeMode === 'system' ? `Folgt aktuell dem ${darkMode ? 'dunklen' : 'hellen'} Systemdesign.` : `MealFlow verwendet immer den ${preferences.themeMode === 'dark' ? 'dunklen' : 'hellen'} Modus.`}</Text>'''
          cozy_block = appearance_hint + '''
            <View style={styles.preferenceDivider} />
            <View style={styles.preferenceRow}><View style={styles.flex1}><View style={styles.cozyTitleRow}><MaterialCommunityIcons name="weather-sunset" size={19} color={colors.accent} /><Text style={styles.fieldLabel}>Cozy Mode</Text></View><Text style={styles.fieldHint}>Wärmere Farben und eine ruhigere, wohnlichere MealFlow-Atmosphäre.</Text></View><Switch value={preferences.cozyMode} onValueChange={(value) => update({ cozyMode: value })} trackColor={{ true: colors.accentSoft }} thumbColor={preferences.cozyMode ? colors.accent : undefined} /></View>'''
          if appearance_hint not in settings:
              raise SystemExit('settings appearance hint not found')
          settings = settings.replace(appearance_hint, cozy_block)
          app = app[:settings_start] + settings + app[settings_end:]

          # Faster initial loading and stale-load collision protection.
          app = app.replace("  const [darkMode, setDarkMode] = useState(false);", "  const [darkMode, setDarkMode] = useState(false);\n  const loadGeneration = useRef(0);")
          reload_start = app.index('  const reloadAll = async () => {', app.index('function MainApp()'))
          reload_end = app.index('\n\n  useEffect(() => {', reload_start)
          new_reload = '''  const reloadAll = async (fastStart = false) => {
            const generation = ++loadGeneration.current;
            clearHouseholdCache();
            const nextHousehold = await loadHousehold();
            if (generation !== loadGeneration.current) return;
            setHousehold(nextHousehold);

            const [shopping, plan] = await Promise.all([loadShopping(), loadMealPlan()]);
            if (generation !== loadGeneration.current) return;
            setItems(shopping);
            setMeals(Object.fromEntries(plan.map((entry) => [entry.plannedDate, entry.meal ?? ''])));

            const secondary = Promise.all([
              loadOwnRecipes(),
              loadMealHistory(),
              loadPendingHouseholdInvitations(),
              supabase.auth.getUser(),
            ]);

            if (fastStart) {
              setReady(true);
              secondary.then(([customRecipes, cookedHistory, pending, userResult]) => {
                if (generation !== loadGeneration.current) return;
                setOwnRecipes(customRecipes);
                setHistory(cookedHistory);
                setInvitations(pending);
                setEmail(userResult.data.user?.email ?? '');
              }).catch(() => undefined);
              return;
            }

            const [customRecipes, cookedHistory, pending, userResult] = await secondary;
            if (generation !== loadGeneration.current) return;
            setOwnRecipes(customRecipes);
            setHistory(cookedHistory);
            setInvitations(pending);
            setEmail(userResult.data.user?.email ?? '');
          };'''
          app = app[:reload_start] + new_reload + app[reload_end:]
          app = app.replace("    reloadAll().catch((error) => Alert.alert('Daten konnten nicht geladen werden', germanError(error?.message))).finally(() => setReady(true));", "    reloadAll(true).catch((error) => { setReady(true); Alert.alert('Daten konnten nicht geladen werden', germanError(error?.message)); });")
          app = app.replace("table: 'meal_plan'", "table: 'meal_plan_entries'")
          app = app.replace("setMeals(Object.fromEntries(plan.map((entry) => [entry.day, entry.meal ?? ''])))", "setMeals(Object.fromEntries(plan.map((entry) => [entry.plannedDate, entry.meal ?? ''])))")

          app = app.replace("  const planRecipe = async (day: string) => {\n    if (!recipeToPlan) return;\n    const title = recipeToPlan.recipe.title;\n    setMeals((current) => ({ ...current, [day]: title }));\n    setRecipeToPlan(null);\n    changeTab('woche');\n    try { await saveMeal(day, title); }", "  const planRecipe = async (plannedDate: string) => {\n    if (!recipeToPlan) return;\n    const title = recipeToPlan.recipe.title;\n    setMeals((current) => ({ ...current, [plannedDate]: title }));\n    setRecipeToPlan(null);\n    changeTab('woche');\n    try { await saveMeal(plannedDate, title); }")

          app = app.replace("if (!ready || !household) return <View style={styles.loadingScreen}><View style={styles.brandMark}><MaterialCommunityIcons name=\"silverware-fork-knife\" size={28} color=\"#FFFFFF\" /></View><ActivityIndicator color={colors.accent} /><Text style={styles.loadingText}>Euer Haushalt wird synchronisiert …</Text></View>;", "if (!ready || !household) return <LoadingScreen message=\"Dein Haushalt wird vorbereitet …\" />;")
          app = app.replace("if (checking) return <View style={styles.loadingScreen}><ActivityIndicator color={colors.accent} /></View>;", "if (checking) return <LoadingScreen message=\"Anmeldung wird geprüft …\" />;")

          # Styles for smooth sheets, Cozy setting and improved loading screen.
          app = app.replace("  modalOverlay: { ...StyleSheet.absoluteFill, backgroundColor: colors.overlay },", "  modalOverlay: { ...StyleSheet.absoluteFill, backgroundColor: colors.overlay },")
          app = app.replace("sheetHandle: { width: 38, height: 5, borderRadius: 3, backgroundColor: colors.border, alignSelf: 'center', marginVertical: 10 },", "sheetDismissZone: { minHeight: 28, alignItems: 'center', justifyContent: 'center', marginTop: 1 }, sheetHandle: { width: 38, height: 5, borderRadius: 3, backgroundColor: colors.border, alignSelf: 'center' },")
          app = app.replace("dayPickerButton: { minHeight: 48, borderRadius: radius.md, backgroundColor: colors.surfaceMuted, justifyContent: 'center', paddingHorizontal: 15 }, dayPickerButtonText: { ...typography.bodyStrong, color: colors.text },", "dayPickerButton: { minHeight: 58, borderRadius: radius.md, backgroundColor: colors.surfaceMuted, justifyContent: 'space-between', alignItems: 'center', flexDirection: 'row', paddingHorizontal: 15 }, dayPickerButtonText: { ...typography.bodyStrong, color: colors.text }, dayPickerDate: { ...typography.caption, color: colors.textSecondary, marginTop: 2 },")
          app = app.replace("  preferenceRow: { minHeight: 48, flexDirection: 'row', alignItems: 'center', gap: 12 },", "  preferenceRow: { minHeight: 48, flexDirection: 'row', alignItems: 'center', gap: 12 }, cozyTitleRow: { flexDirection: 'row', alignItems: 'center', gap: 7 },")

          # Replace the basic loading styles with a more polished, lightweight splash state.
          marker = "loadingScreen: { flex: 1, backgroundColor: colors.background, alignItems: 'center', justifyContent: 'center', gap:"
          idx = app.find(marker)
          if idx < 0:
              raise SystemExit('loading style marker not found')
          line_end = app.find('\n', idx)
          old_line = app[idx:line_end]
          new_line = "loadingScreen: { flex: 1, backgroundColor: colors.background, alignItems: 'center', justifyContent: 'center', paddingHorizontal: 34, gap: 10 }, loadingLogo: { width: 68, height: 68, borderRadius: 23, backgroundColor: colors.accent, alignItems: 'center', justifyContent: 'center', marginBottom: 5 }, loadingBrand: { ...typography.h2, color: colors.text }, loadingMessage: { ...typography.body, color: colors.textSecondary, textAlign: 'center' }, loadingProgress: { width: 156, height: 5, borderRadius: 3, overflow: 'hidden', backgroundColor: colors.surfaceMuted, marginTop: 8 }, loadingProgressFill: { width: '68%', height: '100%', borderRadius: 3, backgroundColor: colors.accent }, loadingHint: { ...typography.caption, color: colors.textTertiary, marginTop: 2 },"
          app = app[:idx] + new_line + app[line_end:]

          app_path.write_text(app)

          # Cloud planner v2: date-based rows avoid collisions between weeks.
          cloud_path = Path('src/lib/cloud.ts')
          cloud = cloud_path.read_text()
          cloud = cloud.replace("export type MealDay = { day: string; meal: string | null };", "export type MealDay = { plannedDate: string; day: string; meal: string | null };")
          cloud = cloud.replace("type MealRow = { day: string; meal: string | null };", "type MealRow = { planned_date: string; meal: string | null };")
          load_start = cloud.index('export async function loadMealPlan()')
          load_end = cloud.index('export async function loadOwnRecipes()', load_start)
          new_cloud_plan = '''export async function loadMealPlan(): Promise<MealDay[]> {
            const householdId = await getActiveHouseholdId();
            const from = new Date();
            from.setDate(from.getDate() - 8);
            const until = new Date();
            until.setDate(until.getDate() + 22);
            const toIso = (date: Date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            const { data, error } = await supabase
              .from('meal_plan_entries')
              .select('planned_date,meal')
              .eq('household_id', householdId)
              .gte('planned_date', toIso(from))
              .lte('planned_date', toIso(until))
              .order('planned_date', { ascending: true });
            if (error) throw error;
            return ((data ?? []) as MealRow[]).map((row) => {
              const plannedDate = String(row.planned_date);
              const date = new Date(`${plannedDate}T12:00:00`);
              const rawDay = date.toLocaleDateString('de-AT', { weekday: 'long' });
              return { plannedDate, day: rawDay.charAt(0).toUpperCase() + rawDay.slice(1), meal: row.meal == null ? null : String(row.meal) };
            });
          }

          export async function saveMeal(plannedDate: string, meal: string | null) {
            const householdId = await getActiveHouseholdId();
            const user = await requireUser();
            const clean = meal?.trim() || null;
            if (!clean) {
              const { error } = await requireCloud().from('meal_plan_entries').delete().eq('household_id', householdId).eq('planned_date', plannedDate);
              if (error) throw error;
              return;
            }
            const { error } = await requireCloud()
              .from('meal_plan_entries')
              .upsert({ household_id: householdId, owner_id: user.id, planned_date: plannedDate, meal: clean }, { onConflict: 'household_id,planned_date' });
            if (error) throw error;
          }

          '''
          cloud = cloud[:load_start] + new_cloud_plan + cloud[load_end:]
          cloud_path.write_text(cloud)

          # Native/app versions.
          app_json_path = Path('app.json')
          cfg = json.loads(app_json_path.read_text())
          cfg['expo']['version'] = '2.1.5'
          cfg['expo']['ios']['buildNumber'] = '11'
          cfg['expo']['android']['versionCode'] = 11
          app_json_path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n')

          package_path = Path('package.json')
          pkg = json.loads(package_path.read_text())
          pkg['version'] = '2.1.5'
          package_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          entry = '''# MealFlow Changelog

          ## 2.1.5

          - Wochenplan auf die kommende Woche umgestellt und datumsbasiert gespeichert, damit Wochen nicht mehr kollidieren.
          - Bottom-Sheets leichter und flüssiger dargestellt; dunkler Schatten deutlich reduziert.
          - Bottom-Sheets können über den Griff nach unten geschlossen werden.
          - Rezept-Editor und Rezeptdetails respektieren die iPhone-Safe-Area vollständig.
          - Schnellerer Start: Haushalt, Einkauf und Plan werden zuerst geladen; sekundäre Daten folgen danach.
          - Schutz gegen veraltete parallele Ladevorgänge beim Haushaltswechsel.
          - Cozy Mode als persönliche Designoption für warme Farben im hellen und dunklen Erscheinungsbild.
          - App-Version 2.1.5, iOS Build 11, Android Version Code 11.

          '''
          if changelog.startswith('# MealFlow Changelog\n'):
              changelog = entry + changelog[len('# MealFlow Changelog\n\n'):]
          else:
              changelog = entry + changelog
          changelog_path.write_text(changelog)
          PY

