name: Fix MealFlow 2.2.9 Lidl categorization

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-v229-lidl-short-keywords.py'
      - '.github/workflows/fix-v229-lidl-short-keywords.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply matcher hardening
        run: python3 scripts/fix-v229-lidl-short-keywords.py
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git commit -m "fix: harden Lidl category matching"
          git push
