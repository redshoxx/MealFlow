name: Bump MealFlow 2.3.0

on:
  push:
    branches: [main]
    paths:
      - 'scripts/bump-v230.py'
      - '.github/workflows/bump-v230.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply version bump
        run: python3 scripts/bump-v230.py
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit verified version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json app.json CHANGELOG.md
          git commit -m "chore: release MealFlow 2.3.0"
          git push
