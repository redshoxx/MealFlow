name: Recover MealFlow 2.1.5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-2-1-5.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reapply 2.1.5 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          data = Path('.github/workflows/apply-2-1-5.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(data) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(data)) if data[i].strip() == 'PY')
          lines = []
          for line in data[start:end]:
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply_215.py').write_text('\n'.join(lines) + '\n')
          PY
          python3 /tmp/apply_215.py

      - name: Restore configuration styles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('App.tsx')
          s = p.read_text()
          needle = "  recipeWizardHeaderText: { flex: 1, alignItems: 'center' },"
          insert = "  configurationTitle: { ...typography.title, color: colors.text, textAlign: 'center' },\n  configurationText: { ...typography.body, color: colors.textSecondary, textAlign: 'center', maxWidth: 340 },\n\n"
          if 'configurationTitle:' not in s:
              if needle not in s:
                  raise SystemExit('style insertion point not found')
              s = s.replace(needle, insert + needle, 1)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Commit final MealFlow 2.1.5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-2-1-5.yml .github/workflows/recover-2-1-5.yml
          git add App.tsx src/lib/cloud.ts app.json package.json CHANGELOG.md
          git commit -m "Build MealFlow 2.1.5 performance and cozy update"
          git pull --rebase origin main
          git push origin main
