name: Apply MealFlow 2.2.9 source migration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-2.2.9.cjs'
      - 'src/screens/BudgetScreen.tsx'

permissions:
  contents: write

jobs:
  migrate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply 2.2.9 patch
        run: node scripts/apply-2.2.9.cjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate diff
        run: git diff --check

      - name: Commit source update
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx src/lib/preferences.ts app.json package.json README.md CHANGELOG.md src/screens/BudgetScreen.tsx
          git commit -m "feat: MealFlow 2.2.9 budget replaces pantry"
          git push origin main
