name: Apply MealFlow 2.2.2 Quality

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v222-quality.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply update
        run: python3 scripts/apply-v222.py
      - name: Install dependencies
        run: |
          npm install --ignore-scripts
          npx expo install expo-notifications
      - name: Typecheck
        run: npm run typecheck
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v222-quality.yml .github/workflows/recover-v222-quality.yml
          git rm scripts/apply-v222.py
          git add App.tsx app.json package.json package-lock.json CHANGELOG.md src/lib/expiryNotifications.ts src/lib/inventory.ts src/screens/InventoryScreen.tsx
          git commit -m "Build MealFlow 2.2.2 quality update"
          git push origin main
