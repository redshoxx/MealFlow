name: Apply MealFlow 2.2.6 startup hotfix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-v226-startup-hotfix.py'
      - '.github/workflows/apply-v226-startup-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply startup hotfix
        run: python3 scripts/apply-v226-startup-hotfix.py
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit verified hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx app.json package-lock.json CHANGELOG.md
          git commit -m "Fix MealFlow 2.2.6 startup and performance"
          git push
