name: Apply MealFlow 2.2.3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v223.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply 2.2.3 patch
        run: |
          python3 scripts/apply-v223.py
          python3 scripts/fix-v223-config.py

      - name: Install dependencies
        run: |
          npm install --ignore-scripts
          npx expo install expo-file-system expo-intent-launcher @react-native-community/datetimepicker

      - name: Validate Expo config
        run: npx expo config --type public >/dev/null

      - name: Typecheck
        run: npm run typecheck

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Commit verified app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows/build-android-apk.yml .github/workflows/build-ios-sidestore.yml
          git add App.tsx app.json package.json package-lock.json CHANGELOG.md \
            src/lib/cloud.ts src/screens/InventoryScreen.tsx
          git commit -m "Build MealFlow 2.2.3 platform update"
          git pull --rebase origin main
          git push origin main
