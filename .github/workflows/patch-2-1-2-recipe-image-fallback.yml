name: Apply MealFlow 2.1.2 recipe image fallback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-2-1-2-recipe-image-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch recipe image rendering
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Commit final 2.1.2 patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-2-1-2-recipe-image-fallback.yml
          git add App.tsx
          git commit -m "Finish MealFlow 2.1.2 recipe image fallback"
          git pull --rebase origin main
          git push origin main
