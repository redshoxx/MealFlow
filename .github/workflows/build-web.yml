name: Build MealFlow Web

on:
  push:
    branches: [main]
    paths:
      - 'App.web.tsx'
      - 'src/**'
      - 'app.json'
      - 'app.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'assets/**'
      - 'vercel.json'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Export web app
        run: npm run build:web
      - name: Verify web output
        run: test -f dist/index.html
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: MealFlow-Web
          path: dist
          if-no-files-found: error
          retention-days: 14
