name: Prepare MealFlow Web

on:
  push:
    branches: [main]
    paths:
      - 'App.web.tsx'
      - 'app.json'
      - 'package.json'
      - '.github/workflows/setup-web.yml'

permissions:
  contents: write

jobs:
  prepare-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install existing dependencies
        run: npm ci --ignore-scripts
      - name: Install Expo web dependencies
        run: npx expo install react-dom react-native-web @expo/metro-runtime --npm
      - name: Typecheck
        run: npm run typecheck
      - name: Export web application
        run: npm run build:web
      - name: Commit verified web dependencies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore: add verified Expo web dependencies"
          git push
