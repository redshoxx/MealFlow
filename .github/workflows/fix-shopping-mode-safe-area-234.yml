name: Apply MealFlow 2.3.4 Shopping Mode Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-shopping-mode-safe-area-234.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply 2.3.4 fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('App.tsx')
          s = p.read_text()

          anchor = "  const [shoppingMode, setShoppingMode] = useState(false);\n"
          insert = anchor + "  const shoppingModeInsets = useSafeAreaInsets();\n"
          if 'const shoppingModeInsets = useSafeAreaInsets();' not in s:
              if anchor not in s:
                  raise SystemExit('shopping mode state anchor not found')
              s = s.replace(anchor, insert, 1)

          start_marker = '    <Modal visible={shoppingMode}'
          end_marker = '    <Modal transparent visible={addOpen}'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('shopping mode modal block not found')

          block = s[start:end]
          old_open = "      <SafeAreaView style={styles.shoppingModeRoot} edges={['top', 'bottom']}>"
          new_open = "      <View style={[styles.shoppingModeRoot, { paddingTop: Math.max(shoppingModeInsets.top, Platform.OS === 'ios' ? 48 : 28), paddingBottom: Math.max(shoppingModeInsets.bottom, 8) }]}>"
          if old_open not in block:
              raise SystemExit('shopping mode SafeAreaView opening not found')
          block = block.replace(old_open, new_open, 1)

          old_close = '      </SafeAreaView>\n    </Modal>'
          new_close = '      </View>\n    </Modal>'
          if old_close not in block:
              raise SystemExit('shopping mode SafeAreaView closing not found')
          block = block.replace(old_close, new_close, 1)
          s = s[:start] + block + s[end:]
          p.write_text(s)

          app_path = Path('app.json')
          app = json.loads(app_path.read_text())
          app['expo']['version'] = '2.3.4'
          app['expo']['ios']['buildNumber'] = '28'
          app['expo']['android']['versionCode'] = 28
          app_path.write_text(json.dumps(app, ensure_ascii=False, indent=2) + '\n')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['version'] = '2.3.4'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          lock_path = Path('package-lock.json')
          lock = json.loads(lock_path.read_text())
          lock['version'] = '2.3.4'
          if isinstance(lock.get('packages'), dict) and '' in lock['packages']:
              lock['packages']['']['version'] = '2.3.4'
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit checked fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx app.json package.json package-lock.json
          git diff --cached --quiet || git commit -m "Fix shopping mode safe area for MealFlow 2.3.4"
          git push
