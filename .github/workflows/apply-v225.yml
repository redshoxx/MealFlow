name: Apply MealFlow 2.2.5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v225.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply 2.2.5 patch
        run: python3 scripts/apply-v225.py

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Commit verified update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx src/lib/cloud.ts app.json package.json package-lock.json CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "Build MealFlow 2.2.5 dual meal plan"
          git push
