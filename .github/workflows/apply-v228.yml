name: Apply MealFlow 2.2.8

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-v228.py'
      - '.github/workflows/apply-v228.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply 2.2.8 patch
        run: python3 scripts/apply-v228.py
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit verified update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx src/lib/cloud.ts app.json package.json package-lock.json CHANGELOG.md
          git commit -m "Build MealFlow 2.2.8 shopping reliability update"
          git push
