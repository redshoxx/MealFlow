name: Apply MealFlow 2.1.4 UX update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-2-1-4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply 2.1.4 UX changes
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch214.py
          python3 /tmp/patch214.py

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Commit MealFlow 2.1.4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-2-1-4.yml
          git add App.tsx src/lib/cloud.ts package-lock.json
          git commit -m "Build MealFlow 2.1.4 UX and shopping update"
          git pull --rebase origin main
          git push origin main
