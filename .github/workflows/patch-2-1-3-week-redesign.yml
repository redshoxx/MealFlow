name: Apply MealFlow 2.1.3 week planner redesign

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-2-1-3-week-redesign.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Redesign weekly dinner planner
        run: |
          echo ' ' | base64 -d > /tmp/patch_week.py
          python3 /tmp/patch_week.py

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Commit week planner redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-2-1-3-week-redesign.yml
          git add App.tsx
          git commit -m "Redesign MealFlow 2.1.3 week planner"
          git pull --rebase origin main
          git push origin main
