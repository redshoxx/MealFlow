name: Apply MealFlow 2.3.4 Shopping Mode Fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-shopping-mode-234.py'
      - '.github/workflows/apply-shopping-mode-234.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python scripts/apply-shopping-mode-234.py
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx app.json package.json package-lock.json
          git commit -m "Fix shopping mode overview in MealFlow 2.3.4"
          git push
