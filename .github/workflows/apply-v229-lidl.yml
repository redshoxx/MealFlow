name: Apply MealFlow 2.2.9 Lidl sorting

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-v229-lidl.py'
      - '.github/workflows/apply-v229-lidl.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply 2.2.9 Lidl/performance patch
        run: python3 scripts/apply-v229-lidl.py
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit verified update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx app.json CHANGELOG.md
          git commit -m "feat: faster MealFlow 2.2.9 with Lidl shopping sort"
          git push
